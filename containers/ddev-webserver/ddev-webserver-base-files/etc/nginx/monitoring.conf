    ## provide a health check endpoint
    location /healthcheck {
        auth_basic off;
        access_log off;
        stub_status     on;
        keepalive_timeout 0;    # Disable HTTP keepalive
        return 200;
    }

    location ~ ^/phpstatus$ {
        auth_basic off;
        access_log off;
        stub_status     on;
        keepalive_timeout 0;    # Disable HTTP keepalive
        # Only the in-container healthcheck needs this; php-fpm parses any
        # request it receives, so outside clients must not reach it.
        allow 127.0.0.1;
        deny all;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
