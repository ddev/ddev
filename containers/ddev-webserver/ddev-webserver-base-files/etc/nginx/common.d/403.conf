    # Explain the 403 nginx returns for a directory that exists but has no index
    # file and no autoindex (misconfigured docroot, or project not installed
    # yet).
    #
    # Every nginx-site*.conf ends its `index` list with /ddev-webserver-403-error,
    # which the index module reaches only after every real index file was
    # missing. `deny`/EACCES 403s never reach the index module, and there is no
    # error_page 403 outside the internal location below, so those and app 403s
    # keep their own response.
    location = /ddev-webserver-403-error {
        internal;
        # An aliased static file would answer 200, so return 403 and let this
        # location-scoped error_page serve the page with the 403 preserved.
        error_page 403 /ddev-webserver-403-error-body;
        return 403;
    }

    # The page shared with Apache's conf-enabled/403.conf. It lives under
    # /usr/local/share, not /var/www, for the reason documented in 404.conf.
    location = /ddev-webserver-403-error-body {
        internal;
        default_type text/html;
        add_header X-Ddev-403-Source "ddev-webserver (nginx)" always;
        alias /usr/local/share/ddev-webserver-403-error.html;
    }
