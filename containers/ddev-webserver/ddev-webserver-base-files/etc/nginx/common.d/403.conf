    # Explain webserver-layer 403s — a directory with no index file and no
    # autoindex, or a deny rule — instead of a bare 403. The mechanics are the
    # ones documented in 404.conf. Nothing here changes how nginx decides to
    # return a 403, so `autoindex on` still produces a listing and the reason for
    # every 403 is still written to the error log.
    error_page 403 /ddev-webserver-403-error;

    location = /ddev-webserver-403-error {
        internal;
        # An aliased static file answers 200 on its own; force 403 so a legacy
        # project config that still reaches this path via its `index` list (not
        # error_page) also reports the right status.
        return 403;
        error_page 403 /ddev-webserver-403-error-body;
    }

    location = /ddev-webserver-403-error-body {
        internal;
        default_type text/html;
        add_header X-Ddev-403-Source "ddev-webserver (nginx)" always;
        alias /usr/local/share/ddev-webserver-403-error.html;
    }
