    # Explain webserver-layer 404s (missing file, wrong docroot, or a nonexistent
    # PHP script) instead of returning a bare 404.
    #
    # error_page only fires for a 404 nginx produces itself: `try_files` finding
    # neither $uri nor index.php, or `try_files $uri =404` rejecting a missing
    # *.php file before php-fpm. With `fastcgi_intercept_errors off`, any 404 that
    # php-fpm or the app returns with a body passes through unchanged.
    error_page 404 /ddev-webserver-404-error;

    # error_page with no `=` code keeps the 404 status, though the static file
    # alone would be a 200. The file lives under /usr/local/share, not /var/www,
    # which a `nocopy` volume shadows in Mutagen/no-bind-mounts modes.
    location = /ddev-webserver-404-error {
        internal;
        default_type text/html;
        add_header X-Ddev-404-Source "ddev-webserver (nginx)" always;
        alias /usr/local/share/ddev-webserver-404-error.html;
    }
