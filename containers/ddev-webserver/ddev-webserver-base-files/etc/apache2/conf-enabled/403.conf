# Explain the 403 Apache returns for a directory that exists but has no
# DirectoryIndex file and no directory listing (misconfigured docroot, or
# project not installed yet).
#
# mod_dir's DirectoryIndex accepts a URL outside the requested directory, and
# reaches this last candidate only after every real index file was missing.
# Restating dir.conf's list here (conf-enabled loads after mods-enabled, so this
# server-scope directive wins) applies it to every VirtualHost; keep it in sync
# with mods-enabled/dir.conf. Require/auth 403s run before mod_dir and there is
# no ErrorDocument 403, so those and app 403s are untouched.
#
# The fallback must be an existing file, and PHP rather than static HTML so it
# can emit a real 403 instead of 200. It lives under /usr/local/share, not
# /var/www, for the Mutagen-volume reason documented in 404.conf.
DirectoryIndex index.html index.cgi index.pl index.php index.xhtml index.htm /ddev-webserver-403-error
Alias /ddev-webserver-403-error /usr/local/share/ddev-webserver-403-error.php
<Directory /usr/local/share>
    Require all granted
</Directory>
