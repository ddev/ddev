# Explain webserver-layer 403s — a directory with no index file and no
# directory listing, or an authorization rule — instead of a bare 403.
#
# Mechanics, including the REDIRECT_STATUS guard and why the page lives under
# /usr/local/share, are documented in 404.conf. Nothing here changes how Apache
# decides to return a 403: mod_dir and mod_autoindex keep their own behavior, so
# `Options +Indexes` still produces a listing, and the reason for every 403 is
# still written to the error log.
Alias /ddev-webserver-403-error /usr/local/share/ddev-webserver-403-error.html
<Directory /usr/local/share>
    Require all granted
</Directory>
<Location /ddev-webserver-403-error>
    Require expr %{ENV:REDIRECT_STATUS} != ''
    ForceType text/html
    Header always set X-Ddev-403-Source "ddev-webserver (apache)"
</Location>
ErrorDocument 403 /ddev-webserver-403-error
