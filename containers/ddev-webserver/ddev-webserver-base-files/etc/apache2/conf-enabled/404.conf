# Explain webserver-layer 404s (missing file or wrong docroot) instead of
# returning a bare 404.
#
# Set at server-config scope, outside any VirtualHost, so every site inherits it
# and a project overrides it from its own vhost or .htaccess (`ErrorDocument 404
# default` restores Apache's page). It only fires for 404s Apache generates
# itself: a missing static file, or a missing *.php/.phar/.phtml (the
# php*-fpm.conf handlers are guarded with `-f %{REQUEST_FILENAME}`, so those
# never reach php-fpm). `ProxyErrorOverride` is off, so a 404 that php-fpm or
# the app returns with a body is passed through. The file lives under
# /usr/local/share, not /var/www, which a `nocopy` volume shadows under Mutagen.
Alias /ddev-webserver-404-error /usr/local/share/ddev-webserver-404-error.html
<Directory /usr/local/share>
    Require all granted
</Directory>
<Location /ddev-webserver-404-error>
    # Apache sets REDIRECT_STATUS only on an ErrorDocument redirect, so the page
    # answers as an error document but not as a URL of the project's own.
    Require expr %{ENV:REDIRECT_STATUS} != ''
    ForceType text/html
    Header always set X-Ddev-404-Source "ddev-webserver (apache)"
</Location>
ErrorDocument 404 /ddev-webserver-404-error
