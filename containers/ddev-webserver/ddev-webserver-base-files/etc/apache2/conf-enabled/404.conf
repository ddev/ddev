# Explain webserver-layer 404s (missing file or wrong docroot) instead of
# returning a bare 404.
#
# Set at server-config scope, outside any VirtualHost, so every site inherits it.
# It only fires for 404s Apache generates itself: a missing static file, or a
# missing *.php/.phar/.phtml (the php*-fpm.conf handlers are guarded with
# `-f %{REQUEST_FILENAME}`, so those never reach php-fpm). `ProxyErrorOverride`
# is off, so a 404 that php-fpm or the app returns with a body is passed through.
#
# The file lives under /usr/local/share, not /var/www, which a `nocopy` volume
# shadows in Mutagen/no-bind-mounts modes.
Alias /ddev-webserver-404-error /usr/local/share/ddev-webserver-404-error.html
<Directory /usr/local/share>
    Require all granted
</Directory>
<Location /ddev-webserver-404-error>
    ForceType text/html
    Header always set X-Ddev-404-Source "ddev-webserver (apache)"
</Location>
ErrorDocument 404 /ddev-webserver-404-error
