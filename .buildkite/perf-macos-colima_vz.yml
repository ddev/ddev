# Nightly performance benchmark: Colima (VZ) on macOS arm64
#
# This must be configured in the Buildkite dashboard as its own pipeline
# (e.g. "ddev-perf-macos-colima-vz") pointed at this file, with a Scheduled
# Build (nightly cron) rather than a push/PR trigger, so it never competes
# with the macos-colima_vz correctness-test pipeline for the same agents.
# See perf/README.md.

  - command: ".buildkite/perf.sh"
    if: |
      build.message !~ /\[(skip ci|skip buildkite)\]/
    agents:
      - "os=macos"
      - "colima=true"
      - "colima_vz=true"
      - "architecture=arm64"
    env:
      BUILDKITE_CLEAN_CHECKOUT: true
      BUILDKITE_BUILD_PATH: ~/tmp/buildkite_builds
      BUILDKIT_PROGRESS: plain
      DOCKER_TYPE: "colima_vz"
      LIMA_SSH_PORT_FORWARDER: "true"
    parallelism: 1
