# Nightly performance benchmark: Docker Desktop on macOS arm64
#
# Docker Desktop has its own dedicated machines (macstadium-m1,
# tb-macos-arm64-4), unlike the other five macOS providers, which share a
# single 3-machine pool -- see perf-macos-shared-providers.yml for why those
# are combined into one sequential pipeline instead of one each.
#
# Configure in the Buildkite dashboard as its own pipeline pointed at this
# file, with a Scheduled Build (nightly cron) rather than a push/PR trigger.
# See perf/README.md.

  - command: ".buildkite/perf.sh"
    if: |
      build.message !~ /\[(skip ci|skip buildkite)\]/
    agents:
      - "os=macos"
      - "docker-desktop=true"
      - "architecture=arm64"
    env:
      BUILDKITE_CLEAN_CHECKOUT: true
      BUILDKITE_BUILD_PATH: ~/tmp/buildkite_builds
      BUILDKIT_PROGRESS: plain
      DOCKER_TYPE: "docker-desktop"
    parallelism: 1
