# Nightly performance benchmark: Rancher Desktop on macOS arm64
#
# Configure in the Buildkite dashboard as its own pipeline pointed at this
# file, with a Scheduled Build (nightly cron) rather than a push/PR trigger.
# See perf/README.md.

  - command: ".buildkite/perf.sh"
    if: |
      build.message !~ /\[(skip ci|skip buildkite)\]/
    agents:
      - "os=macos"
      - "rancher-desktop=true"
      - "architecture=arm64"
    env:
      BUILDKITE_CLEAN_CHECKOUT: true
      BUILDKITE_BUILD_PATH: ~/tmp/buildkite_builds
      BUILDKIT_PROGRESS: plain
      DOCKER_TYPE: "rancher-desktop"
    parallelism: 1
