# See https://golangci-lint.run/
version: "2"
run:
  modules-download-mode: vendor
  timeout: 30m
output:
  formats:
    text:
      path: stdout
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - modernize
    - revive
    - staticcheck
    - whitespace
    # Enable these when working on test refactoring
    #- testifylint
    #- usetesting
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # path treats only "/" as a separator, so these break Windows host paths.
        # path.Join stays allowed for container and embed paths.
        - pattern: ^path\.(Base|Clean|Dir|Ext|IsAbs|Match|Split)$
          msg: use path/filepath for host paths; add //nolint:forbidigo with the reason for a container path, URL or embed path
    staticcheck:
      checks:
        - all
        - -QF1001 # Apply De Morgan's law
        - -QF1003 # Convert if/else-if chain to tagged switch
        - -S1008 # Simplify returning boolean expression
        - -S1023 # Omit redundant control flow
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
        - name: import-shadowing
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party/ampli/ampli.go
formatters:
  enable:
    - gofmt
