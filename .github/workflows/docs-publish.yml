name: docspublish

# Publishes https://ddev.github.io/ddev/:
#   /             .github/pages/ (index, 404, docs/ redirect)
#   /docs/en/*/   docs built from the main (latest) and stable branches
#   /perf/        dashboards and data from the performance-data branch,
#                 updated nightly by perf-collect.yml
on:
  push:
    branches: [ main, stable ]

  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with upterm set "debug_enabled"'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: docs-latest
          fetch-depth: 0

      # From ddev/ddev, so a fork also gets the stable docs and dashboard data.
      - name: Checkout stable branch
        uses: actions/checkout@v7
        with:
          repository: ddev/ddev
          ref: stable
          path: docs-stable
          fetch-depth: 0

      - name: Checkout performance-data branch
        uses: actions/checkout@v7
        with:
          repository: ddev/ddev
          ref: performance-data
          path: perf-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Setup upterm session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true

      - name: Copy static pages
        run: |
          cp -rv docs-latest/.github/pages/. _site/
          cp -v docs-latest/docs/content/favicon.png _site/

      - name: Build docs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site/docs/en
          for version in latest stable; do
            pip install -r "docs-${version}/docs/requirements.txt"
            sed -i "s|^site_url:.*|site_url: ${BASE_URL}/docs/en/${version}/|" "docs-${version}/mkdocs.yml"
            (cd "docs-${version}" && READTHEDOCS_VERSION_NAME="${version}" zensical build --clean --strict)
            mv "docs-${version}/site" "_site/docs/en/${version}"
          done

      - name: Copy performance dashboards
        run: rsync -av --exclude=.git --exclude='*-cursor.json' perf-data/ _site/perf/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, because deploy-pages in the same job can look up the
  # artifact before GitHub lists it: actions/deploy-pages#451
  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-26.04
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment

      - name: Report deployed URL
        run: echo "### Deployed ${{ steps.deployment.outputs.page_url }}" | tee -a "$GITHUB_STEP_SUMMARY"
