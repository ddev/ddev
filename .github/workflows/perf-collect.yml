name: Collect and publish nightly performance results

# Runs after the nightly perf-*.yml (Buildkite) and perf-linux.yml (GitHub
# Actions) benchmark jobs should have finished, pulls each leg's latest
# result, appends to the versioned history.ndjson dataset, and publishes the
# dashboard via GitHub Pages. See perf/README.md.
#
# One-time manual setup required (can't be done from this repo):
#   - Create a BUILDKITE_API_TOKEN repo secret (read access to builds/artifacts).
#   - Enable GitHub Pages for this repo with source "GitHub Actions".
#   - Update perf/collector/pipelines.json with the actual Buildkite pipeline
#     slugs once the perf-*.yml pipelines are created in the Buildkite dashboard.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: perf-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check out or create performance-data branch
        run: |
          if git ls-remote --exit-code --heads origin performance-data >/dev/null 2>&1; then
            git fetch origin performance-data:performance-data
          else
            git branch performance-data
          fi
          git worktree add ../performance-data performance-data

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Collect results
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch ../performance-data/history.ndjson
          node perf/collector/collect.js ../performance-data/history.ndjson
          cp perf/collector/dashboard.html ../performance-data/index.html

      - name: Commit and push results
        run: |
          cd ../performance-data
          git config user.name "ddev-perf-bot"
          git config user.email "actions@github.com"
          git add history.ndjson index.html
          git diff --cached --quiet || git commit -m "Add nightly performance results $(date -u +%F)"
          git push origin performance-data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../performance-data

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
