name: Collect and publish nightly performance results

# Runs after the nightly perf-*.yml (Buildkite) and perf-linux.yml (GitHub
# Actions) benchmark jobs should have finished. Pulls each leg's latest
# result(s), appends them to the versioned history.ndjson dataset on the
# performance-data branch, and (if anything changed) triggers docs-publish.yml
# to redeploy Pages. docs-publish.yml owns the actual Pages deployment and
# folds the dashboard in under /perf/ -- a repo has only one Pages site, and
# docs-publish.yml already deploys the docs there on every push to
# main/stable, so this workflow deploying to the same site directly would
# race it and overwrite the docs (or vice versa). See perf/README.md.
#
# One-time manual setup required (can't be done from this repo):
#   - Add a BUILDKITE_API_TOKEN item (read access to builds/artifacts) to the
#     test-secrets 1Password vault used by TESTS_SERVICE_ACCOUNT_TOKEN.
#   - Update perf/collector/pipelines.json with the actual Buildkite pipeline
#     slugs once the perf-*.yml pipelines are created in the Buildkite dashboard.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Wipe ci/test-runtime-history.ndjson and ci/tests/per-test-history.ndjson and rebuild both from scratch instead of appending (use after a schema change to either row format, so old rows do not miss new fields)'
        required: false
        type: boolean
        default: false
      since:
        description: 'Override --since for this run (YYYY-MM-DD). Mainly useful with fresh=true, to pull back further than the default 7-day backfill window.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: perf-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # continue-on-error so a missing BUILDKITE_API_TOKEN vault item doesn't turn
      # every nightly run red before the one-time setup below is done. collect.js
      # already degrades per-source: without the token it warns and skips the
      # Buildkite pipelines, still collecting the GitHub Actions Linux leg.
      - name: Load 1password secret(s)
        continue-on-error: true
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.TESTS_SERVICE_ACCOUNT_TOKEN }}"
          BUILDKITE_API_TOKEN: "op://test-secrets/BUILDKITE_API_TOKEN/credential"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # performance-data is a data-only orphan branch: it holds the nightly perf
      # benchmark dashboard (index.html, dashboard-common.js/css, history.ndjson)
      # at its root, the CI test-runtime dashboard under ci/ (ci/index.html,
      # ci/test-runtime-history.ndjson), and the per-test trend dashboard under
      # ci/tests/ (ci/tests/index.html, ci/tests/per-test-history.ndjson) -- see
      # HANDOFF.md for why these are separate pages. Branching it off main's HEAD instead would
      # give it a copy of the whole repo tree plus these data files, and leave a
      # branch that diverges from main forever.
      - name: Check out or create performance-data branch
        run: |
          if git ls-remote --exit-code --heads origin performance-data >/dev/null 2>&1; then
            git fetch origin performance-data:performance-data
            git worktree add ../performance-data performance-data
          else
            echo "No performance-data branch yet; creating it as an orphan."
            git worktree add --detach ../performance-data HEAD
            git -C ../performance-data checkout --orphan performance-data
            # checkout --orphan keeps the working tree and index; empty both so the
            # first commit contains only the data files added below.
            git -C ../performance-data rm -rq --cached .
            git -C ../performance-data clean -qfdx
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Collect results
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch ../performance-data/history.ndjson
          node perf/collector/collect.js ../performance-data/history.ndjson
          cp perf/collector/perf-dashboard.html ../performance-data/index.html
          cp perf/collector/dashboard-common.js ../performance-data/dashboard-common.js
          cp perf/collector/dashboard-common.css ../performance-data/dashboard-common.css

      # Separate dataset from the nightly perf benchmarks above, and a
      # separate page (/perf/ci/, not /perf/) -- total runtime per CI test
      # workflow (golang-nginx-fpm, quickstart, etc.) is an unrelated
      # question for an unrelated (internal-only) audience. See HANDOFF.md
      # and perf/collector/README.md.
      - name: Collect test-runtime results
        id: collect-test-runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../performance-data/ci
          if [ "${{ inputs.fresh }}" = "true" ]; then
            echo "fresh=true: rebuilding ci/test-runtime-history.ndjson from scratch"
            rm -f ../performance-data/ci/test-runtime-history.ndjson
          fi
          touch ../performance-data/ci/test-runtime-history.ndjson
          node perf/collector/collect-test-runtime.js ../performance-data/ci/test-runtime-history.ndjson ${{ inputs.since != '' && format('--since={0}', inputs.since) || '' }}
          cp perf/collector/ci-dashboard.html ../performance-data/ci/index.html

      # Second pass over the file the previous step just wrote: downloads
      # each new run's gotestsum artifact and appends one row per
      # slow-or-failing top-level Go test to per-test-history.ndjson --
      # turns per-test detail that otherwise lives only in a 90-day build
      # artifact into a lasting, trend-able dataset. See collect-per-test.js
      # and HANDOFF.md.
      - name: Collect per-test results
        id: collect-per-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../performance-data/ci/tests
          if [ "${{ inputs.fresh }}" = "true" ]; then
            echo "fresh=true: rebuilding per-test-history.ndjson from scratch"
            rm -f ../performance-data/ci/tests/per-test-history.ndjson ../performance-data/ci/tests/per-test-cursor.json
          fi
          touch ../performance-data/ci/tests/per-test-history.ndjson
          node perf/collector/collect-per-test.js ../performance-data/ci/test-runtime-history.ndjson ../performance-data/ci/tests/per-test-history.ndjson ../performance-data/ci/tests/per-test-cursor.json ${{ inputs.since != '' && format('--since={0}', inputs.since) || '' }}
          cp perf/collector/per-test-dashboard.html ../performance-data/ci/tests/index.html

      - name: Commit and push results
        id: commit
        run: |
          cd ../performance-data
          git config user.name "ddev-perf-bot"
          git config user.email "actions@github.com"
          git add history.ndjson index.html dashboard-common.js dashboard-common.css ci/index.html ci/test-runtime-history.ndjson ci/tests/index.html ci/tests/per-test-history.ndjson ci/tests/per-test-cursor.json
          if git diff --cached --quiet; then
            echo "No new results to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add nightly performance results $(date -u +%F)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin performance-data
          fi

      # workflow_dispatch and repository_dispatch are the two documented exceptions
      # to the rule that events raised with GITHUB_TOKEN don't start a new workflow
      # run, so this dispatch does fire docs-publish.yml. Only on an actual change,
      # so a no-result night doesn't redeploy the docs site for nothing.
      - name: Trigger docs-publish rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # github.ref_name, not a hardcoded 'main': the nightly cron always
        # runs against the repo's default branch (main), so this is a no-op
        # behavior change there, but a `workflow_dispatch` run against a
        # feature branch (testing a change to this workflow, or to the
        # dashboard files it deploys) needs to redeploy THAT branch's
        # docs-publish.yml/dashboard files -- a hardcoded 'main' here
        # silently re-triggers main's unmodified docs-publish.yml right
        # after, clobbering whatever the feature branch's own manual
        # docs-publish dispatch just deployed. Caught live: this exact bug
        # took down the real public /perf/ page (dropped dashboard-common.js
        # /css and the new /perf/ci/ page) while testing this PR pre-merge.
        run: gh workflow run docs-publish.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"

      # Deliberately last: collect.js exits 0 even when a source failed, so
      # the commit/push and docs-publish steps above still run and publish
      # whatever clean results came through. This step turns the run red
      # anyway, but only after that publishing has already happened -- a
      # broken source should be visible, not silently swallowed, but it also
      # shouldn't block the legs that worked.
      - name: Fail if any source had a collection error
        if: steps.collect.outputs.had_errors == 'true' || steps.collect-test-runtime.outputs.test_runtime_had_errors == 'true' || steps.collect-per-test.outputs.per_test_had_errors == 'true'
        run: |
          echo "One or more sources failed to collect this run -- see the 'Collect results' / 'Collect test-runtime results' / 'Collect per-test results' step's ERROR lines above."
          exit 1
