name: Start-time performance check
defaults:
  run:
    shell: bash

# This checks the performance of the Dockerfile/docker-compose layers DDEV
# generates and builds at project-build/start time (WriteBuildDockerfile,
# app_compose_template.yaml, and the base images they build from) - not
# container correctness, which is covered by container-tests.yml. See
# https://github.com/ddev/ddev/issues/8600, where a change to those layers
# regressed `ddev utility rebuild` from ~10s to 27s+ (and much worse on
# some filesystems) without failing any existing test.
#
# PR-only: drift on main is tracked nightly on every platform by
# perf-linux.yml and the Buildkite perf legs, which open perf-regression
# issues (see perf/README.md).
on:
  pull_request:
    branches: [ main ]
    paths:
      - "pkg/ddevapp/**"
      - "pkg/dockerutil/**"
      - "containers/ddev-webserver/**"
      - "containers/ddev-dbserver/**"
      - "containers/ddev-traefik-router/**"
      - "containers/ddev-ssh-agent/**"
      - "go.mod"
      - "go.sum"
      - "!**/*_test.go"
      - "!containers/*/tests/**"
      - "scripts/compare-start-perf.sh"
      - ".github/workflows/perf-start-time.yml"
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline ref to compare against (default: latest release tag on workflow_dispatch, PR base commit on pull_request)'
        required: false
        default: ''
      debug_enabled:
        description: 'Run the build with upterm set "debug_enabled"'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  start-perf-regression:
    name: ddev start / ddev utility rebuild performance
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Need history for both the current commit and the baseline ref.
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          brew-gh-api-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove unnecessary items on disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install test dependencies (linux-setup.sh)
        run: ./.github/workflows/linux-setup.sh

      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.23'
          check-latest: true

      - name: Wait for pushed images
        # This runner holds no push credentials, so it can race
        # image-push.yml's approval/build/push - see containers/wait-for-images.sh.
        run: containers/wait-for-images.sh

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Determine baseline ref
        id: baseline
        run: |
          if [ -n "${{ inputs.baseline }}" ]; then
            ref="${{ inputs.baseline }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="${{ github.event.pull_request.base.sha }}"
          else
            ref=$(git describe --tags --abbrev=0)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Comparing two refs on the same runner in the same job cancels out
      # most of the noise on shared runners. Fails only when start or rebuild
      # is both 50% and 5s slower: base-vs-PR medians have stayed within +21%
      # (start) and +42%/6.6s (rebuild), while #8600 was 10s -> 27s.
      - name: Compare ddev start / ddev utility rebuild performance
        env:
          DDEV_NO_INSTRUMENTATION: "true"
        run: |
          set -eu -o pipefail
          scripts/compare-start-perf.sh -n 3 -b 3 -m off -P -f 50 -s 5 \
            "${{ steps.baseline.outputs.ref }}" "${{ github.sha }}" \
            2>&1 | tee /tmp/perf-compare.log

      - name: Post summary
        if: always()
        run: |
          {
            echo "### Start/rebuild performance: baseline (\`${{ steps.baseline.outputs.ref }}\`) vs this commit"
            echo '```'
            cat /tmp/perf-compare.log 2>/dev/null || echo "(no output captured; the comparison step likely failed before finishing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
