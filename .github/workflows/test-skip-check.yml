name: Determine Test Eligibility

on:
  workflow_call:
    outputs:
      should_skip:
        description: Whether the caller should skip its test jobs
        value: ${{ jobs.determine-test-eligibility.outputs.should_skip }}

jobs:
  determine-test-eligibility:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
          else
            MESSAGE=$(git log -1 --pretty=%B)
            if [[ "$MESSAGE" == *"[skip github]"* ]]; then
              echo "Found [skip github] in commit message, skipping tests"
              echo "should_skip=true" >> $GITHUB_OUTPUT
            else
              echo "should_skip=false" >> $GITHUB_OUTPUT
            fi
          fi
