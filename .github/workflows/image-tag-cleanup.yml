name: Image tag cleanup
defaults:
  run:
    shell: bash

# Runs containers/image-tag-cleanup.sh, which describes the candidates.
#   1. Weekly, or on demand without images_to_delete: lists every candidate
#      by tag, in batches of up to 100 tags, each with a line to paste.
#   2. On demand with images_to_delete: shows which of those tags are still
#      candidates, and with "execute" checked, from main, after the
#      image-tag-cleanup environment's approval, deletes the candidates among them.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      before_release:
        description: 'Candidates are build tags pushed before this release, like v1.25.4. Empty: the latest release.'
        required: false
        default: ""
      images_to_delete:
        description: 'Tags to delete: a batch line copied from a run without them.'
        required: false
        default: ""
      execute:
        description: 'Delete images_to_delete (unchecked is a dry run)'
        type: boolean
        required: false
        default: false

env:
  DOCKER_ORG: "${{ vars.DOCKER_ORG || (github.repository_owner == 'ddev-test' && 'ddevhq' || 'ddev') }}"
  GH_TOKEN: ${{ github.token }}
  BEFORE_RELEASE: ${{ inputs.before_release }}
  IMAGES_TO_DELETE: ${{ inputs.images_to_delete }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry run
    if: ${{ !inputs.execute }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: containers/image-tag-cleanup.sh ${BEFORE_RELEASE:+--before-release "$BEFORE_RELEASE"} "$IMAGES_TO_DELETE"

  delete:
    name: Delete images_to_delete
    if: ${{ inputs.execute && inputs.images_to_delete && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    environment: image-tag-cleanup
    steps:
      - uses: actions/checkout@v7
      - name: Load 1password secret(s)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}"
          DOCKERHUB_TOKEN: "op://push-secrets/DOCKERHUB_TOKEN/credential"
      - env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: containers/image-tag-cleanup.sh --execute ${BEFORE_RELEASE:+--before-release "$BEFORE_RELEASE"} "$IMAGES_TO_DELETE"
