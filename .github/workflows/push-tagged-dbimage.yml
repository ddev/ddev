name: Push tagged db image
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to push (v1.25.0 for a release). Leave empty to use the tag this branch needs.'
        required: false
        default: ""
      debug_enabled:
        description: 'Enable debug mode'
        type: boolean
        required: false
        default: false
env:
  REGISTRY: docker.io
  DOCKER_ORG: "${{ vars.DOCKER_ORG || (github.repository_owner == 'ddev-test' && 'ddevhq' || 'ddev') }}"

permissions:
  contents: read

jobs:
  # The variant matrix and which of them are multi-arch both come from
  # containers/ddev-dbserver/variants.txt, shared with that directory's
  # Makefile and with image-configs.sh.
  variants:
    name: Read the db variant matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.variants.outputs.matrix }}
      multi_arch_images: ${{ steps.variants.outputs.multi_arch_images }}
      all_repos: ${{ steps.variants.outputs.all_repos }}
      tag: ${{ steps.tag.outputs.tag }}
      alias: ${{ steps.tag.outputs.alias }}
    steps:
      - uses: actions/checkout@v7
      - id: variants
        run: |
          set -eu -o pipefail
          V=containers/ddev-dbserver/variants.sh
          {
            echo "matrix=$($V json)"
            echo "multi_arch_images=$($V multi-arch-variants)"
            echo "all_repos=$($V repos | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"
      # An empty tag input means "publish what this checkout needs", which is
      # derivable; retyping the content hash by hand is how it ends up not
      # matching versionconstants.go.
      - id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          ALIAS_BRANCH: ${{ github.ref_name }}
        run: |
          set -eu -o pipefail
          HASH_LEN="${HASH_LEN:-10}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            echo "Using the tag supplied on the workflow input: ${TAG}"
          else
            TAG="$(containers/image-tag-for.sh ddev-dbserver-mariadb-11.8)"
            echo "No tag supplied; using the tag this checkout needs: ${TAG}"
          fi
          containers/validate-image-tag.sh "$TAG" || [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # A readable neighbour for a bare hash, so the registry tag list
          # still says which branch produced it. A release tag is already
          # readable and gets none.
          ALIAS=""
          if [[ "$TAG" =~ ^[0-9a-f]{${HASH_LEN}}$ ]]; then
            ALIAS="$(echo "$ALIAS_BRANCH" | sed -E 's/[^A-Za-z0-9_.-]+/-/g')-${TAG}"
            if containers/validate-image-tag.sh "$ALIAS"; then
              echo "Publishing the alias ${ALIAS} alongside ${TAG}"
            else
              echo "Alias '${ALIAS}' rejected; publishing only ${TAG}" >&2
              ALIAS=""
            fi
          fi
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"

  build-db-arch:
    name: build ${{ matrix.build.arch }} ${{ matrix.build.dbtype }}
    needs: variants
    env:
      TAG: ${{ needs.variants.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.variants.outputs.matrix) }}
    runs-on: ${{ matrix.build.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - name: Determine if multi-arch build
        id: meta
        env:
          MULTI_ARCH_IMAGES: ${{ needs.variants.outputs.multi_arch_images }}
          DBTYPE: ${{ matrix.build.dbtype }}
        run: |
          set -eu -o pipefail
          if [[ " ${MULTI_ARCH_IMAGES} " == *" ${DBTYPE} "* ]]; then
            echo "multi_arch=true" >> $GITHUB_OUTPUT
          else
            echo "multi_arch=false" >> $GITHUB_OUTPUT
          fi
      - name: Load 1password secret(s)
        uses: 1password/load-secrets-action@v5
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == github.repository_owner }}
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}"
          DOCKERHUB_TOKEN: "op://push-secrets/DOCKERHUB_TOKEN/credential"
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # MySQL 8.0/8.4/9.7 build FROM dhi.io/mysql (Docker Hardened Images), which
      # requires authentication. Docker Hub credentials are used. See ddev/ddev#7962.
      - name: Login to dhi.io (Docker Hardened Images)
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Clean up stale arch tag before push
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username":"${{ vars.DOCKERHUB_USERNAME }}","password":"${{ env.DOCKERHUB_TOKEN }}"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          ORG_IMAGE=${DOCKER_ORG}/ddev-dbserver-$(echo "${{ matrix.build.dbtype }}" | tr '_' '-')
          echo "Cleaning up stale tag for ${ORG_IMAGE}:${TAG}-${{ matrix.build.arch }}"
          curl -s -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/${ORG_IMAGE}/tags/${TAG}-${{ matrix.build.arch }}/" >/dev/null || true
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      - name: Build and push ${{ env.DOCKER_ORG }}/ddev-dbserver-${{ matrix.build.dbtype }}:${{ env.TAG }} ${{ matrix.build.arch }} image
        run: |
          set -eu
          cd containers/ddev-dbserver
          target="${{ matrix.build.dbtype }}_${{ matrix.build.arch }}"
          echo "Building target $target for arch ${{ matrix.build.arch }}"
          version="${TAG}"
          if [ "${{ steps.meta.outputs.multi_arch }}" = "true" ]; then
            version="${version}-${{ matrix.build.arch }}"
          fi
          make $target PUSH=true VERSION="${version}" DDEV_IMAGE_TAG="${TAG}"
      - name: Record image information
        id: image-info
        run: |
          set -eu
          INSPECT_IMAGE=${DOCKER_ORG}/ddev-dbserver-$(echo "${{ matrix.build.dbtype }}" | tr '_' '-'):${TAG}
          if [ "${{ steps.meta.outputs.multi_arch }}" = "true" ]; then
            INSPECT_IMAGE=${INSPECT_IMAGE}-${{ matrix.build.arch }}
          fi
          INSPECT_OUTPUT=""
          # Wait for image to be available with retry logic
          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            if INSPECT_OUTPUT=$(docker buildx imagetools inspect "${INSPECT_IMAGE}" 2>/dev/null); then
              break
            fi
            echo "Image ${INSPECT_IMAGE} not yet available, waiting... (attempt ${i}/${MAX_RETRIES})"
            sleep 3
          done
          if [ -z "$INSPECT_OUTPUT" ]; then
            echo "Failed to retrieve image information with 'docker buildx imagetools inspect ${INSPECT_IMAGE}'"
            exit 1
          fi
          echo "$INSPECT_OUTPUT" > image-info.txt
      - name: Upload image info artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-info-ddev-dbserver-${{ matrix.build.dbtype }}-${{ matrix.build.arch }}
          path: image-info.txt
          retention-days: 1
  create-manifests:
    name: create multi-arch db manifests
    needs: [variants, build-db-arch]
    runs-on: ubuntu-24.04
    env:
      MULTI_ARCH_IMAGES: ${{ needs.variants.outputs.multi_arch_images }}
      ALL_REPOS: ${{ needs.variants.outputs.all_repos }}
      TAG: ${{ needs.variants.outputs.tag }}
      ALIAS: ${{ needs.variants.outputs.alias }}
    steps:
      # Needed for containers/image-metadata.sh below.
      - uses: actions/checkout@v7
      - name: Load 1password secret(s)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}"
          DOCKERHUB_TOKEN: "op://push-secrets/DOCKERHUB_TOKEN/credential"
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Create and push manifests
        run: |
          set -eu
          # Get Docker Hub token for cleanup
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username":"${{ vars.DOCKERHUB_USERNAME }}","password":"${{ env.DOCKERHUB_TOKEN }}"}' https://hub.docker.com/v2/users/login/ | jq -r .token)

          # Create and push multi-arch manifests. ALIAS, when set, is a second
          # name on the same manifest - see the variants job.
          for variant in ${MULTI_ARCH_IMAGES}; do
            ORG_IMAGE=${DOCKER_ORG}/ddev-dbserver-$(echo "${variant}" | tr '_' '-')
            NAMES=(-t "${ORG_IMAGE}:${TAG}")
            [ -n "${ALIAS}" ] && NAMES+=(-t "${ORG_IMAGE}:${ALIAS}")
            read -r -a ANNOTATIONS <<< "$(containers/image-metadata.sh annotations "${TAG}" "${ORG_IMAGE##*/}")"
            docker buildx imagetools create "${ANNOTATIONS[@]}" "${NAMES[@]}" ${ORG_IMAGE}:${TAG}-amd64 ${ORG_IMAGE}:${TAG}-arm64
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              docker buildx imagetools create -t ${ORG_IMAGE}:latest ${ORG_IMAGE}:${TAG}
            fi
          done

          # The amd64-only variants are pushed straight to ${TAG} and never
          # reach the loop above, so they need the alias adding separately.
          if [ -n "${ALIAS}" ]; then
            for repo in ${ALL_REPOS}; do
              variant="$(echo "${repo#ddev-dbserver-}" | tr '-' '_')"
              case " ${MULTI_ARCH_IMAGES} " in *" ${variant} "*) continue ;; esac
              ORG_IMAGE=${DOCKER_ORG}/${repo}
              echo "Aliasing ${ORG_IMAGE}:${TAG} as ${ALIAS}"
              docker buildx imagetools create -t "${ORG_IMAGE}:${ALIAS}" "${ORG_IMAGE}:${TAG}"
            done
          fi

          # Clean up intermediary single-arch tags from remote registry
          for variant in ${MULTI_ARCH_IMAGES}; do
            ORG_IMAGE=${DOCKER_ORG}/ddev-dbserver-$(echo "${variant}" | tr '_' '-')
            echo "Removing ${ORG_IMAGE}:${TAG}-amd64 and ${TAG}-arm64"
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/${ORG_IMAGE}/tags/${TAG}-amd64/" >/dev/null || true
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/${ORG_IMAGE}/tags/${TAG}-arm64/" >/dev/null || true
          done
