# Signs windows and macOS binaries and installers
name: Main branch build/release (signed)
defaults:
  run:
    shell: bash
on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with upterm set "debug_enabled"'
        type: boolean
        required: false
        default: false

# We do not cancel in-progress builds here because in general we
# want to see success on each commit, and we usually use [skip ci]
# to prevent builds on commits that don't matter.
#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AmplitudeAPIKey: ${{ secrets.AMPLITUDE_API_KEY }}
  BUILDKIT_PROGRESS: plain
  DOCKER_CLI_EXPERIMENTAL: enabled
  DDEV_DEBUG: true
  FURY_ACCOUNT: ${{ vars.FURY_ACCOUNT }}
  CLOUDSMITH_ORG: ${{ vars.CLOUDSMITH_ORG }}
  CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO }}
  HOMEBREW_EDGE_REPOSITORY: ${{ vars.HOMEBREW_EDGE_REPOSITORY }}
  HOMEBREW_STABLE_REPOSITORY: ${{ vars.HOMEBREW_STABLE_REPOSITORY }}
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  DOCKER_ORG: ${{ vars.DOCKER_ORG }}

permissions:
  packages: write

jobs:
  # Every executable we ship, Windows included, cross-compiles on Linux. One
  # job per platform because each GOOS/GOARCH pays its own cold-cache compile
  # of the standard library and vendored deps, so they only get faster by
  # running on separate machines.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_amd64,   target: linux_amd64 completions }
          - { platform: linux_arm64,   target: linux_arm64 }
          - { platform: darwin_amd64,  target: darwin_amd64 }
          - { platform: darwin_arm64,  target: darwin_arm64 }
          - { platform: windows_amd64, target: windows_amd64_binaries }
          - { platform: windows_arm64, target: windows_arm64_binaries }
    steps:
      - uses: actions/checkout@v7
        with:
          # We need to get all branches and tags for git describe to work properly
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.23'
          check-latest: true

      # The Windows targets stop at the binaries; NSIS cannot run until they
      # come back signed. See the build-installers job.
      - name: Build DDEV executables
        run: make ${{ matrix.target }}

      - name: Set up Homebrew
        if: matrix.platform == 'linux_amd64'
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.03.2
        with:
          brew-gh-api-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Docker and deps
        if: matrix.platform == 'linux_amd64'
        run: ./.github/workflows/linux-setup.sh

      - name: "Verify that instrumentation is working (Linux amd64)"
        if: matrix.platform == 'linux_amd64'
        run: |
          export PATH=".gotmp/bin/linux_amd64:$PATH"
          echo "DDEV_NO_INSTRUMENTATION=${DDEV_NO_INSTRUMENTATION}"
          if [ -z "${AmplitudeAPIKey}" ]; then echo "AmplitudeAPIKey is not set"; exit 1; fi
          ddev config global --instrumentation-opt-in=true
          ddev config global | grep instrumentation-opt-in=true
          ddev version | grep -v "AmplitudeAPIKey is not available."
          ddev config global --instrumentation-opt-in=false

      - name: Upload ${{ matrix.platform }} build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: .gotmp/bin/${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload completions
        if: matrix.platform == 'linux_amd64'
        uses: actions/upload-artifact@v7
        with:
          name: build-completions
          path: |
            .gotmp/bin/completions.tar.gz
            .gotmp/bin/completions
          retention-days: 1
          if-no-files-found: error

  # This self-hosted runner holds the code-signing dongle. It deliberately does
  # no checkout and runs no repository code: it downloads executables, runs
  # signtool, and uploads them again. Keep it that way - anything else puts a
  # certificate we cannot rotate behind whatever a workflow change happens to
  # run.
  sign-windows-binaries:
    name: Sign Windows binaries
    runs-on: [ self-hosted, windows-signer ]
    needs: build
    env:
      DDEV_WINDOWS_SIGN: ${{ vars.DDEV_WINDOWS_SIGN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-windows_*
          path: incoming

      - name: Lay out binaries
        run: |
          set -eu -o pipefail
          mkdir -p bin
          for arch in amd64 arm64; do
            mv "incoming/build-windows_${arch}" "bin/windows_${arch}"
          done

      - name: Sign Windows binaries
        run: |
          set -eu -o pipefail
          if [ "${DDEV_WINDOWS_SIGN}" != "true" ]; then echo "Warning: DDEV_WINDOWS_SIGN=${DDEV_WINDOWS_SIGN} is not true"; exit 0; fi
          for arch in amd64 arm64; do
            signtool sign -fd SHA256 \
              "bin/windows_${arch}/ddev.exe" \
              "bin/windows_${arch}/ddev-hostname.exe" \
              "bin/windows_${arch}/mkcert.exe" \
              "bin/windows_${arch}/ddev_gen_autocomplete.exe"
          done

      - name: "Verify that instrumentation is working (Windows)"
        run: |
          export PATH="bin/windows_amd64:$PATH"
          echo "DDEV_NO_INSTRUMENTATION=${DDEV_NO_INSTRUMENTATION}"
          if [ -z "${AmplitudeAPIKey}" ]; then echo "AmplitudeAPIKey is not set"; exit 1; fi
          ddev config global --instrumentation-opt-in=true
          ddev config global | grep instrumentation-opt-in=true
          ddev version | grep -v "AmplitudeAPIKey is not available."
          ddev config global --instrumentation-opt-in=false

      - name: Verify that binaries were signed
        if: vars.DDEV_WINDOWS_SIGN == 'true'
        run: |
          set -eu -o pipefail
          for arch in amd64 arm64; do
            for f in ddev.exe ddev-hostname.exe mkcert.exe; do
              signtool verify -pa "bin/windows_${arch}/${f}"
            done
          done

      - name: Upload signed Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-binaries
          path: bin
          retention-days: 1
          if-no-files-found: error

  # NSIS has to run between the two signing passes: it packs the signed
  # ddev-hostname.exe and mkcert.exe, and the installer it emits then needs
  # signing itself.
  build-installers:
    name: Build Windows installers
    runs-on: ubuntu-latest
    needs: sign-windows-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: ./.github/workflows/linux-build-setup.sh

      - name: Restore signed Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: signed-windows-binaries
          path: signed

      # The installer bundles the Linux binaries for the WSL2 install path.
      - name: Restore Linux builds
        uses: actions/download-artifact@v8
        with:
          pattern: build-linux_*
          path: linux

      - name: Assemble .gotmp/bin
        run: |
          set -eu -o pipefail
          for arch in amd64 arm64; do
            mkdir -p ".gotmp/bin/windows_${arch}" ".gotmp/bin/linux_${arch}"
            cp -a "signed/windows_${arch}/." ".gotmp/bin/windows_${arch}/"
            cp -a "linux/build-linux_${arch}/." ".gotmp/bin/linux_${arch}/"
            chmod +x ".gotmp/bin/linux_${arch}"/*
          done

      - name: Build installers
        run: make windows_amd64_package windows_arm64_package

      - name: Upload unsigned installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: .gotmp/bin/windows_*/ddev_windows_*_installer.exe
          retention-days: 1
          if-no-files-found: error

  sign-windows-installers:
    name: Sign Windows installers
    runs-on: [ self-hosted, windows-signer ]
    needs: build-installers
    env:
      DDEV_WINDOWS_SIGN: ${{ vars.DDEV_WINDOWS_SIGN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-installers
          path: bin

      - name: Sign Windows installers
        run: |
          set -eu -o pipefail
          if [ "${DDEV_WINDOWS_SIGN}" != "true" ]; then echo "Warning: DDEV_WINDOWS_SIGN=${DDEV_WINDOWS_SIGN} is not true"; exit 0; fi
          for arch in amd64 arm64; do
            signtool sign -fd SHA256 "bin/windows_${arch}/ddev_windows_${arch}_installer.exe"
          done

      - name: Verify that installers were signed
        if: vars.DDEV_WINDOWS_SIGN == 'true'
        run: |
          set -eu -o pipefail
          for arch in amd64 arm64; do
            signtool verify -pa "bin/windows_${arch}/ddev_windows_${arch}_installer.exe"
          done

      - name: Upload signed installers
        uses: actions/upload-artifact@v7
        with:
          name: signed-installers
          path: bin
          retention-days: 1
          if-no-files-found: error

  notarize-macos:
    name: Sign and Notarize ddev on macOS
    runs-on: macos-latest
    needs: build
    steps:
      - name: Load 1password secret(s)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}"
          DDEV_MACOS_APP_PASSWORD: "op://push-secrets/DDEV_MACOS_APP_PASSWORD/credential"
          DDEV_MACOS_SIGNING_PASSWORD: "op://push-secrets/DDEV_MACOS_SIGNING_PASSWORD/credential"

      - name: "setup macOS"
        run: |
          # The macos-latest runner image pre-taps aws/tap, which Homebrew 6.0+
          # flags as untrusted on every invocation. We don't use it, so remove it.
          brew untap aws/tap || true
          brew install coreutils gnu-getopt jq
      - uses: actions/checkout@v7
        with:
          # We need to get all branches and tags for git describe to work properly
          fetch-depth: 0

      - name: Restore darwin builds
        uses: actions/download-artifact@v8
        with:
          pattern: build-darwin_*
          path: darwin

      - name: Assemble .gotmp/bin
        run: |
          set -eu -o pipefail
          for arch in amd64 arm64; do
            mkdir -p ".gotmp/bin/darwin_${arch}"
            cp -a "darwin/build-darwin_${arch}/." ".gotmp/bin/darwin_${arch}/"
            chmod +x ".gotmp/bin/darwin_${arch}"/*
          done

      - name: Sign and notarize binaries (amd64 and arm64)
        env:
          TEAM_ID: "9HQ298V2BW"
          DISABLE_NOTARIZATION: ${{ vars.DISABLE_NOTARIZATION }}
        run: |
          set -o errexit -o pipefail
          if [ -z "${DDEV_MACOS_SIGNING_PASSWORD}" ] ; then echo "DDEV_MACOS_SIGNING_PASSWORD is empty"; exit 1; fi
          if [ -z "${DDEV_MACOS_APP_PASSWORD}" ] ; then echo "DDEV_MACOS_APP_PASSWORD is empty"; exit 1; fi
          for item in .gotmp/bin/darwin*/ddev .gotmp/bin/darwin*/ddev-hostname; do
            echo "Signing and notarizing ${item} ..."
            codesign --remove-signature "${item}" || true
            curl -s https://raw.githubusercontent.com/ddev/signing_tools/master/macos_sign.sh | bash -s -  --signing-password="${DDEV_MACOS_SIGNING_PASSWORD}" --cert-file=certfiles/ddev_developer_id_cert.p12 --cert-name="Developer ID Application: Localdev Foundation (9HQ298V2BW)" --target-binary="${item}"
            if [ "${DISABLE_NOTARIZATION:-}" != "true" ]; then
              curl -sSL -f https://raw.githubusercontent.com/ddev/signing_tools/master/macos_notarize.sh | bash -s -  --app-specific-password=${DDEV_MACOS_APP_PASSWORD} --apple-id=notarizer@localdev.foundation --primary-bundle-id=com.ddev.ddev --target-binary="${item}"
            else
              echo "Notarization disabled via DISABLE_NOTARIZATION=true environment variable"
            fi
          done

      - name: Upload notarized binaries
        uses: actions/upload-artifact@v7
        with:
          name: notarized-darwin
          path: .gotmp/bin/darwin_*
          retention-days: 1
          if-no-files-found: error

  artifacts:
    env:
      AUR_PACKAGE_NAME: ${{ vars.AUR_PACKAGE_NAME }}
      AUR_EDGE_GIT_URL: ${{ vars.AUR_EDGE_GIT_URL }}
      AUR_STABLE_GIT_URL: ${{ vars.AUR_STABLE_GIT_URL }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    name: Upload artifacts
    runs-on: ubuntu-latest
    needs: [build, sign-windows-installers, notarize-macos]
    steps:
      - name: Load 1password secret(s)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}"
          AUR_SSH_PRIVATE_KEY: "op://push-secrets/AUR_SSH_PRIVATE_KEY/private key?ssh-format=openssh"
          CHOCOLATEY_API_KEY: "op://push-secrets/CHOCOLATEY_API_KEY/credential"
          GITHUB_TOKEN: "op://push-secrets/DDEV_GITHUB_TOKEN/credential"
          DDEV_MACOS_APP_PASSWORD: "op://push-secrets/DDEV_MACOS_APP_PASSWORD/credential"
          DDEV_MACOS_SIGNING_PASSWORD: "op://push-secrets/DDEV_MACOS_SIGNING_PASSWORD/credential"
          DOCKERHUB_TOKEN: "op://push-secrets/DOCKERHUB_TOKEN/credential"
          FURY_TOKEN: "op://push-secrets/FURY_TOKEN/credential_${{ github.repository_owner }}"
          DDEV_CLOUDSMITH_API_TOKEN: "op://push-secrets/DDEV_CLOUDSMITH_API_TOKEN/credential"
          GORELEASER_KEY: "op://push-secrets/GORELEASER_KEY/credential"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.23'
          check-latest: true

      - name: Download all build outputs
        uses: actions/download-artifact@v8
        with:
          path: incoming

      # Everything arrives as artifacts, which do not carry the executable bit,
      # and the signed copies have to win over the unsigned ones they replace.
      - name: Assemble .gotmp/bin
        run: |
          set -eu -o pipefail
          mkdir -p .gotmp/bin
          for arch in amd64 arm64; do
            mkdir -p ".gotmp/bin/linux_${arch}" ".gotmp/bin/darwin_${arch}" ".gotmp/bin/windows_${arch}"
            cp -a "incoming/build-linux_${arch}/." ".gotmp/bin/linux_${arch}/"
            cp -a "incoming/notarized-darwin/darwin_${arch}/." ".gotmp/bin/darwin_${arch}/"
            cp -a "incoming/signed-windows-binaries/windows_${arch}/." ".gotmp/bin/windows_${arch}/"
            cp -a "incoming/signed-installers/windows_${arch}/." ".gotmp/bin/windows_${arch}/"
          done
          cp -a incoming/build-completions/. .gotmp/bin/
          chmod +x .gotmp/bin/{linux,darwin}_{amd64,arm64}/{ddev,ddev-hostname,mkcert}

      # Signing rewrote the installers after they were built, so this is the
      # first point at which they can be hashed.
      - name: Generate installer checksums and WSL2 copies
        run: make windows_amd64_installer_checksum windows_arm64_installer_checksum wsl_amd64_copy wsl_arm64_copy

      - name: Build chocolatey on release
        if: startsWith( github.ref, 'refs/tags/v1')
        run: make chocolatey

      - name: "Verify that cgo_enabled is 0 in Linux binary"
        run: |
          .gotmp/bin/$(go env GOOS)_$(go env GOARCH)/ddev version
          cgo=$(".gotmp/bin/$(go env GOOS)_$(go env GOARCH)/ddev" version 2>/dev/null | awk '/cgo_enabled/ {print $2}')
          if [ "${cgo}" != "0" ]; then echo "CGO_ENABLED=${cgo} but it must be 0 in released binary" && exit 10; fi

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      # Goreleaser does GitHub release artifacts, homebrew, AUR, deb/rpm
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        if: startsWith( github.ref, 'refs/tags/v1')
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean
        env:
          CGO_ENABLED: 0

      # Do artifacts for upload to workflow URL
      - name: Generate artifacts
        run: ./.ci-scripts/generate_artifacts.sh ${{ github.workspace }}/artifacts

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-ddev-executables
          path: ${{ github.workspace }}/artifacts/*
      - name: Upload macos-amd64 binary
        uses: actions/upload-artifact@v7
        with:
          name: ddev-macos-amd64
          path: |
            .gotmp/bin/darwin_amd64/ddev
            .gotmp/bin/darwin_amd64/ddev-hostname
            .gotmp/bin/darwin_amd64/mkcert
      - name: Upload macos-arm64 binary
        uses: actions/upload-artifact@v7
        with:
          name: ddev-macos-arm64
          path: |
            .gotmp/bin/darwin_arm64/ddev
            .gotmp/bin/darwin_arm64/ddev-hostname
            .gotmp/bin/darwin_arm64/mkcert
      - name: Upload linux-arm64 binary
        uses: actions/upload-artifact@v7
        with:
          name: ddev-linux-arm64
          path: |
            .gotmp/bin/linux_arm64/ddev
            .gotmp/bin/linux_arm64/ddev-hostname
            .gotmp/bin/linux_arm64/mkcert
      - name: Upload linux-amd64 binary
        uses: actions/upload-artifact@v7
        with:
          name: ddev-linux-amd64
          path: |
            .gotmp/bin/linux_amd64/ddev
            .gotmp/bin/linux_amd64/ddev-hostname
            .gotmp/bin/linux_amd64/mkcert
      - name: Upload windows-amd64 binary
        uses: actions/upload-artifact@v7
        with:
          name: ddev-windows-amd64
          path: |
            .gotmp/bin/windows_amd64/ddev.exe
            .gotmp/bin/windows_amd64/ddev-hostname.exe
            .gotmp/bin/windows_amd64/mkcert.exe

      - name: Upload windows_amd64 installer
        uses: actions/upload-artifact@v7
        with:
          name: ddev-windows-amd64-installer
          path: .gotmp/bin/windows_amd64/ddev_windows_amd64_installer.exe
      - name: Upload windows-arm64 binary
        uses: actions/upload-artifact@v7
        with:
          name: ddev-windows-arm64
          path: |
            .gotmp/bin/windows_arm64/ddev.exe
            .gotmp/bin/windows_arm64/ddev-hostname.exe
            .gotmp/bin/windows_arm64/mkcert.exe
      - name: Upload windows_arm64 installer
        uses: actions/upload-artifact@v7
        with:
          name: ddev-windows-arm64-installer
          path: .gotmp/bin/windows_arm64/ddev_windows_arm64_installer.exe

      - name: Show github.ref
        run: echo ${{ github.ref }}

      # TODO: This can be done by goreleaser these days
      - name: Chocolatey windows release
        if: github.repository_owner == 'ddev' && startsWith(github.ref, 'refs/tags/v1')
        run: |
          pushd .gotmp/bin/windows_amd64/chocolatey
          docker run --rm -v $PWD:/tmp/chocolatey -w /tmp/chocolatey linuturk/mono-choco push -s https://push.chocolatey.org/ --api-key "${CHOCOLATEY_API_KEY}"
          popd

  push-devcontainers:
    name: Push devcontainer feature
    runs-on: ubuntu-latest
    needs: artifacts
    steps:
      - name: Load 1password secret(s)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}"
          GITHUB_TOKEN: "op://push-secrets/DDEV_GITHUB_TOKEN/credential"

      - uses: actions/checkout@v7
        with:
          # We need to get all branches and tags for git describe to work properly
          fetch-depth: 0

      - name: Replace version in devcontainer-feature.json
        run: |
          sed -i 's/\${DDEV_VERSION}/'"${GITHUB_REF##*/}"'/g' ./containers/devcontainers/install-ddev/devcontainer-feature.json

      - name: Push DDEV devcontainer feature
        if: startsWith(github.ref, 'refs/tags/v1')
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./containers/devcontainers"
          devcontainer-cli-version: "0.53.0"
          disable-repo-tagging: "true"
