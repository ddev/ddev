name: ddev-ssh-agent

volumes:
  dot_ssh:
    name: "ddev-ssh-agent_dot_ssh"
  socket_dir:
    name: "ddev-ssh-agent_socket_dir"

services:
  ddev-ssh-agent:
    {{ if .UseKeepID }}
    userns_mode: keep-id
    {{ end }}
    container_name: ddev-ssh-agent
    hostname: ddev-ssh-agent
    image: '{{ .SSHAuthImage }}'
    networks:
      - ddev_default
    restart: "no"
    labels:
      {{ .UpstreamLabel }}: '{{ .UpstreamSocket }}'
    {{- if .UpstreamSocket }}
    # Root, because Docker Desktop's host-services socket is root:root 0660
    user: '0:0'
    command: ["socat", "UNIX-LISTEN:/tmp/.ssh-agent/socket,perm=0666,fork,unlink-early", "UNIX-CONNECT:/upstream/{{ .UpstreamName }}"]
    # SELinux labels the upstream socket as host content, which containers cannot use
    security_opt:
      - label=disable
    {{- else }}
    user: '{{ .UID }}:{{ .GID }}'
    {{- end }}
    volumes:
      - "dot_ssh:/tmp/.ssh"
      - "socket_dir:/tmp/.ssh-agent"
      {{- if .UpstreamSocket }}
      - '{{ .UpstreamMount }}'
      {{- end }}
    environment:
      - SSH_AUTH_SOCK=/tmp/.ssh-agent/socket
      - TZ={{ .Timezone }}
    healthcheck:
      test: {{ if .UpstreamSocket }}"killall -0 socat"{{ else }}"/healthcheck.sh"{{ end }}
      interval: 1s
      retries: 2
      start_period: 10s
      {{- if templateCanUse "healthcheck.start_interval" }}
      start_interval: "500ms"
      {{- end }}
      timeout: 62s
networks:
  ddev_default:
    name: ddev_default
    external: true
